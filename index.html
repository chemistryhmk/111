let currentQuestionIdx = 0;
let userScore = 0;

// Utility to shuffle arrays for matching options so they are never pre-aligned
function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function renderQuestion() {
    const quizMain = document.getElementById("quiz-container");
    const q = quizData[currentQuestionIdx];

    document.getElementById("question-count").innerText = `Вопрос ${currentQuestionIdx + 1} из ${quizData.length}`;
    document.getElementById("score-count").innerText = `Набрано баллов: ${userScore}`;
    const progressPercent = ((currentQuestionIdx) / quizData.length) * 100;
    document.getElementById("progress-bar").style.width = `${progressPercent}%`;

    let contentHTML = `
        <div class="card">
            <span class="question-badge">${q.level}</span>
            <div class="question-title">${q.question}</div>
    `;

    if (q.type === "single" || q.type === "multiple") {
        contentHTML += `<ul class="options-list">`;
        q.options.forEach((opt, idx) => {
            const inputType = q.type === "single" ? "radio" : "checkbox";
            const inputName = q.type === "single" ? "quiz-opt" : `quiz-opt-${idx}`;
            contentHTML += `
                <li class="option-item" onclick="toggleInput(${idx}, '${q.type}')">
                    <input type="${inputType}" name="${inputName}" id="opt-${idx}" value="${idx}" onclick="event.stopPropagation()">
                    <label for="opt-${idx}" onclick="event.stopPropagation()">${opt}</label>
                </li>
            `;
        });
        contentHTML += `</ul>`;
    } else if (q.type === "matching") {
        const shuffledOptions = shuffleArray(q.rightOptions);
        contentHTML += `<table class="matching-table">
            <thead>
                <tr>
                    <th>Вопрос / Пункт</th>
                    <th>Выберите правильный ответ</th>
                </tr>
            </thead>
            <tbody>`;
        q.left.forEach((item, idx) => {
            contentHTML += `
                <tr>
                    <td><b>${item}</b></td>
                    <td>
                        <select class="matching-select" id="match-${idx}">
                            <option value="">-- Выберите вариант --</option>
                            ${shuffledOptions.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                        </select>
                    </td>
                </tr>
            `;
        });
        contentHTML += `</tbody></table>`;
    } else if (q.type === "open") {
        contentHTML += `
            <input type="text" class="text-answer-input" id="open-answer" value="" placeholder="Введите ваш ответ..." autocomplete="off">
        `;
    }

    contentHTML += `
            <button class="btn" id="submit-btn" onclick="checkAnswer()">Ответить</button>
            <button class="btn" id="next-btn" style="display:none;" onclick="nextQuestion()">Следующий вопрос →</button>

            <div class="explanation-box" id="explanation-box">
                <div class="explanation-title" id="exp-title"></div>
                <div class="explanation-text" id="exp-text"></div>
            </div>
        </div>
    `;

    quizMain.innerHTML = contentHTML;

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function toggleInput(idx, type) {
    const input = document.getElementById(`opt-${idx}`);
    if (type === 'single') {
        input.checked = true;
    } else {
        input.checked = !input.checked;
    }
}

function checkAnswer() {
    const q = quizData[currentQuestionIdx];
    let isCorrect = false;
    let earnedPoints = 0;

    if (q.type === "single") {
        const selected = document.querySelector('input[name="quiz-opt"]:checked');
        if (!selected) {
            alert("Пожалуйста, выберите вариант ответа!");
            return;
        }
        const val = parseInt(selected.value);
        if (val === q.correct) {
            isCorrect = true;
            earnedPoints = 1;
        }
    } else if (q.type === "multiple") {
        const selected = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(cb => parseInt(cb.value));
        if (selected.length === 0) {
            alert("Пожалуйста, выберите варианты ответа!");
            return;
        }
        const isMatch = selected.length === q.correct.length && selected.every(v => q.correct.includes(v));
        if (isMatch) {
            isCorrect = true;
            earnedPoints = 2;
        }
    } else if (q.type === "matching") {
        let allSelected = true;
        let matchedCorrectly = true;
        q.left.forEach((_, idx) => {
            const sel = document.getElementById(`match-${idx}`).value;
            if (!sel) allSelected = false;
            if (sel !== q.correct[idx]) matchedCorrectly = false;
        });

        if (!allSelected) {
            alert("Пожалуйста, выберите ответы для всех строк!");
            return;
        }
        if (matchedCorrectly) {
            isCorrect = true;
            earnedPoints = 2;
        }
    } else if (q.type === "open") {
        const userAns = document.getElementById("open-answer").value.trim().toLowerCase();
        if (!userAns) {
            alert("Пожалуйста, введите ответ!");
            return;
        }
        const accepted = q.acceptedAnswers.map(a => a.toLowerCase());
        if (accepted.includes(userAns)) {
            isCorrect = true;
            earnedPoints = q.id === 19 || q.id === 30 ? 3 : 2;
        }
    }

    if (isCorrect) {
        userScore += earnedPoints;
        document.getElementById("score-count").innerText = `Набрано баллов: ${userScore}`;
    }

    document.querySelectorAll("input, select, button#submit-btn").forEach(el => el.disabled = true);
    document.getElementById("submit-btn").style.display = "none";
    document.getElementById("next-btn").style.display = "inline-block";

    const expBox = document.getElementById("explanation-box");
    const expTitle = document.getElementById("exp-title");
    const expText = document.getElementById("exp-text");

    expBox.className = `explanation-box ${isCorrect ? 'correct' : 'incorrect'}`;
    expTitle.innerText = isCorrect ? "✓ Верно!" : "✗ Неверно";
    expText.innerHTML = q.explanation;
    expBox.style.display = "block";

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function nextQuestion() {
    currentQuestionIdx++;
    if (currentQuestionIdx < quizData.length) {
        renderQuestion();
    } else {
        renderResults();
    }
}

function renderResults() {
    document.getElementById("progress-bar").style.width = "100%";
    const quizMain = document.getElementById("quiz-container");
    const maxScore = 44;
    const percentage = Math.round((userScore / maxScore) * 100);

    let mark = 10;
    if (percentage < 30) mark = 4;
    else if (percentage < 50) mark = 5;
    else if (percentage < 65) mark = 6;
    else if (percentage < 78) mark = 7;
    else if (percentage < 88) mark = 8;
    else if (percentage < 96) mark = 9;

    quizMain.innerHTML = `
        <div class="card results-card">
            <h2>Тестирование по теме «Химическая связь» полностью завершено!</h2>
            <div class="score-display">${userScore} / ${maxScore} баллов</div>
            <p style="font-size: 1.3rem; font-weight: 600;">Прогнозируемая оценка VBE: <span style="color: var(--primary);">${mark} из 10</span> (${percentage}%)</p>
            <p style="color: var(--text-muted); margin-top: 20px;">
                ${percentage >= 80 
                    ? "Отличная подготовка! Ученица прекрасно разбирается во всех тонкостях механизмов связей, гибридизации и свойств веществ." 
                    : "Хороший результат! Рекомендуется еще раз закрепить тему пространственного строения молекул и водородных связей."}
            </p>
            <button class="btn" onclick="restartQuiz()" style="margin-top: 20px;">Пройти тренажер заново</button>
        </div>
    `;
}

function restartQuiz() {
    currentQuestionIdx = 0;
    userScore = 0;
    renderQuestion();
}

window.onload = renderQuestion;
</script>
